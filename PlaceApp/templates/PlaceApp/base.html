<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My favorite places{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'PlaceApp/css/style.css' %}">
</head>
<body>
    <header>
        <nav>
            <div class="navbar">
                <h1><a href="{% url 'home' %}">My favorite places</a> </h1>
            </div>
            <div class="links">
                <a href="{% url 'place_list' %}">Place list</a>
                <a href="{% url 'add_place' %}">Add place</a>
            </div>
        </nav>
    </header>
    <main>
        {% if messages %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>The site was created on 09/16/2025. Created by Mykhailo Timoshyn.</p>
    </footer>

</body>
</html>
